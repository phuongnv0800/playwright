services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: automation_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/automation_platform
      PLAYWRIGHT_HEADLESS: "true"
    command: npm run db:migrate
    depends_on:
      - postgres

  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/automation_platform
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_STATE_DIR: /data/playwright-state
    command: npm run start:api
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - playwright_state:/data/playwright-state

  worker:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/automation_platform
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_STATE_DIR: /data/playwright-state
    command: npm run start:worker
    depends_on:
      - postgres
    volumes:
      - playwright_state:/data/playwright-state

volumes:
  pgdata:
  playwright_state:
